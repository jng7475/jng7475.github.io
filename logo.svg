  <path d="M46 20 Q39 28 46 36 Q53 44 46 52" fill="none" stroke="#FFF4E0" stroke-width="5" stroke-linecap="round"/>
  <path d="M62 16 Q55 24 62 32 Q69 40 62 48" fill="none" stroke="#FFF4E0" stroke-width="5" stroke-linecap="round"/>
  <path d="M78 20 Q71 28 78 36 Q85 44 78 52" fill="none" stroke="#FFF4E0" stroke-width="5" stroke-linecap="round"/>
  <path d="M80 62 L114 22" fill="none" stroke="#1F5E4A" stroke-width="6" stroke-linecap="round"/>
  <path d="M89 64 L121 30" fill="none" stroke="#1F5E4A" stroke-width="6" stroke-linecap="round"/>
  <path d="M22 64 A42 42 0 0 0 106 64 Z" fill="#C8412B"/>
