  <text x="140" y="72" textLength="262" lengthAdjust="spacingAndGlyphs" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" font-size="58" font-weight="700" fill="#FFF4E0">JASON</text>
  <text x="142" y="106" textLength="258" lengthAdjust="spacingAndGlyphs" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="20" font-weight="700" fill="#E9A23B">RESTAURANT</text>
</svg>
